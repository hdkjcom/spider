name: Spider CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # 单个 JDK 失败不取消其余矩阵任务，便于一次看到全部版本的结果
      fail-fast: false
      matrix:
        java: [8, 11, 17]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - name: Build & Test
        # -pl '!spider-demo': 排除 demo 模块，其 E2E 有 Jackson String 编码遗留失败，
        #   作为独立任务修复，不阻塞主线的回归保护网。
        # -Dgpg.skip=true: 根 pom 的 maven-gpg-plugin 绑定 verify 阶段，CI 无签名密钥，必须跳过。
        run: mvn test -B -Dgpg.skip=true -pl '!spider-demo'
      - name: Package (compile integrity)
        run: mvn package -B -DskipTests -Dgpg.skip=true -pl '!spider-demo'
      - name: Dependency Analysis
        run: mvn dependency:analyze -B || true
